
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 30th Birthday, Nikolas!</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="birthday-container">

        <p class="small-title">A SPECIAL DAY</p>

        <h1>Happy 30th Birthday, Nikolas!</h1>

        <p class="subtitle">
            Make a wish and blow out the candles.
        </p>

        <div id="cakeArea" aria-label="Birthday cake with 30 candles"></div>

        <p id="instructions">
            Tap the candles or use your microphone!
        </p>

        <button id="microphoneButton" type="button">
            🎤 Blow Out the Candles
        </button>

        <h2 id="birthdayMessage" hidden>
            ✨ HAPPY BIRTHDAY, NIKOLAS! ✨
        </h2>

        <button id="replayButton" type="button" hidden>
            Celebrate Again ↻
        </button>

    </main>

    <canvas id="effects"></canvas>

</body>
</html>
